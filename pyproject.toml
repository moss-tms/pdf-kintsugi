[project]
name = "pdf-kintsugi"
version = "0.1.1"
description = "PDF table extraction with Docling and pdfplumber"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "moss (moss-tms)" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "docling>=2.73.0",
    "pdfplumber>=0.11.9",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
